[package]
name = "huahua-prediction"
version = "0.1.0"
authors = ["ChihuahuaChain"]
edition = "2021"
description = "BTC/ETH up/down prediction rounds with USDC bets on ChihuahuaChain"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = "2.1.0"
# Mainnet (wasmvm 2.2) exposes capabilities up to cosmwasm_2_0: do not enable newer ones.
cosmwasm-std = { version = "2.1.0", features = ["cosmwasm_2_0"] }
cw-storage-plus = "2.0.0"
cw-utils = "2.0.0"
cw2 = "2.0.0"
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = "1.0.58"

[dev-dependencies]
cw-multi-test = "2.0.0"

[[bin]]
name = "schema"
path = "src/bin/schema.rs"
